name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core

      - name: 语法检查
        run: python -m compileall -q engine tools bin

      - name: 渲染一帧（不需要音频/ffmpeg）
        run: |
          python tools/still.py --t 41.8 --out out/ci_still.png
          python - <<'PY'
          from PIL import Image
          im = Image.open("out/ci_still.png")
          assert im.size == (1920, 1080), im.size
          px = im.convert("L")
          assert px.getextrema()[1] > 40, "画面全黑，渲染没有画出东西"
          print("still ok:", im.size)
          PY

      - name: 时间轴/场景冒烟（抽样，速度优先）
        run: python tools/check_timeline.py --stride 199

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-still
          path: out/ci_still.png
          if-no-files-found: ignore
